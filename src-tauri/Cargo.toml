[package]
name = "sidebar-term"
version = "0.1.0"
description = "macOS terminal with a sidebar of grouped, renamable tabs"
authors = ["ben-coo-per"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# One core, two binaries (ADR 0002): this package is the Mac app (Tauri); `core/` is the
# sidebar-term core, plain Rust; `daemon/` is `sidebar-termd`, the headless Host daemon. Tauri is a
# dependency of this package only, so `cargo build --bin sidebar-termd` never compiles it.
[workspace]
members = ["core", "daemon"]
default-members = [".", "core", "daemon"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sidebar_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sidebar-term-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via wry; used to read dropped file paths off the drag pasteboard.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Profiles are read from the workspace root only, so these apply to the core and the daemon too.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind" # the monitor catches probe panics; abort would defeat that
strip = true
