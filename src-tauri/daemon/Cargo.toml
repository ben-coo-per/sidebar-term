[package]
name = "sidebar-termd"
version = "0.1.0"
description = "sidebar-term's headless Host daemon: runs Sessions on a machine with no display and serves them to clients over Tailscale"
authors = ["ben-coo-per"]
edition = "2021"

[[bin]]
name = "sidebar-termd"
path = "src/main.rs"

[dependencies]
sidebar-term-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "macros", "time"] }
